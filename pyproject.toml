[project]
name = "forgejo-mcp"
version = "0.1.0"
description = "MCP server (stdio) for the Forgejo REST API: repos, issues, pull requests, files, commits, actions, orgs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.scripts]
forgejo-mcp = "forgejo_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.36.2",
    "python-semantic-release>=10.6.2",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgejo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
